  .rk-act { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--muted); cursor: pointer; min-height: 28px; }

  .rk-score { display: flex; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; }

  .rk-hist { display: flex; align-items: flex-end; gap: 10px; padding-top: 18px; }
  .rk-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .rk-bar { width: 100%; background: var(--chip); border-radius: 6px 6px 2px 2px; }
  .rk-col.me .rk-bar { background: var(--accent); }
  .rk-pct { font-size: .78rem; color: var(--muted); }

  .rk-lab { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .rk-you { position: absolute; bottom: -26px; font-size: .78rem; font-weight: 600; color: var(--accent-text); }
  .rk-next { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); }
  .rk-next ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.7; }
  .rk-h { margin: 0; font-weight: 600; }
  .rk-muted { color: var(--muted); }
  .rk-small { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }
  .snap { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding: 12px 16px; background: var(--chip); border-radius: 10px; font-size: .92rem; }
  .snap p { margin: 0; flex: 1 1 260px; }
  .ind { margin: 22px 0 0; padding: 20px 0 6px; border-top: 1px solid var(--line); }

  .prof-id { min-width: 0; flex: 1 1 280px; }
  .prof-fi { flex: none; max-width: 100%; }
  .info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; margin-left: 6px; padding: 0; border: 1px solid var(--muted); border-radius: 50%; background: none; color: var(--muted); font: 600 .66rem var(--sans); cursor: help; vertical-align: 1px; }

  }

  .work { border-bottom: 1px solid var(--line); }

  .work .count { font-size: .88rem; color: var(--muted); white-space: nowrap; }

  .empty { color: var(--muted); padding: 36px 0; font-family: var(--serif); font-size: 1.1rem; }
  .more { padding: 28px 0 0; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
  footer a { color: inherit; text-underline-offset: 3px; }
  footer p { margin: 0 0 8px; }
  footer details.privacy { margin: 2px 0 8px; }
  footer details.privacy summary { cursor: pointer; width: max-content; padding: 6px 0; color: var(--ink); font-weight: 600; }
  footer details.privacy p { margin: 2px 0 6px; max-width: 70ch; line-height: 1.6; }

<noscript><div style="max-width:640px;margin:48px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif">
<p style="font-family:Georgia,serif;font-size:1.6rem;font-weight:700;margin:0 0 12px">Cine m-a citat</p>
<p>Aplicația are nevoie de JavaScript ca să funcționeze. Activează-l în browser și reîncarcă pagina.</p>

<header class="top">
  <div class="top-in">
    <span class="brand-wrap"><span class="brand" data-i18n="brand"></span><span class="edition" id="edition" data-i18n="edition_badge"></span></span>
    <nav class="langs" aria-label="Language">
      <button data-lang="ro" aria-pressed="false">RO</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="hero_title">Vezi cine te citează, fără să cauți.</h1>
    <p class="lede" data-i18n="hero_sub">Introdu ORCID-ul sau numele tău. Îți găsim lucrările și îți arătăm toate articolele care le citează.</p>
    <div class="search">
      <input type="text" id="q" data-i18n-ph="ph" data-i18n-aria="ph_aria" autocomplete="off">
      <button class="primary" id="go" data-i18n="go"></button>
    </div>
    <details class="opts">
      <summary data-i18n="settings"></summary>
      <div class="field">
        <input type="email" id="email" data-i18n-ph="email_ph" data-i18n-aria="email_aria">
        <button type="button" class="tipbtn" id="tipbtn" aria-describedby="emailtip" aria-expanded="false" data-i18n-aria="tip_aria">?</button>
        <span class="tip" id="emailtip" role="tooltip" data-i18n="email_tip"></span>
      </div>
      <div class="optrow">
        <span class="optlabel" data-i18n="pal_label"></span>
        <div class="pals" id="pals"></div>
      </div>
      <p class="optnote" id="contact" data-i18n-html="contact"></p>
    </details>
    <p id="status" role="status" aria-live="polite"></p>
    <ul class="candidates" id="candidates"></ul>
  </section>

  <div id="profile"></div>

  <footer>
    <p data-i18n-html="footer"></p>
    <details class="privacy"><summary data-i18n="privacy_title"></summary><p data-i18n-html="privacy_body"></p></details>
    <p class="credit"><span data-i18n="credit_made"></span> <span class="heart" aria-hidden="true">♥</span> <span data-i18n="credit_by"></span></p>
  </footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tipbox" class="tipbox" role="tooltip" hidden></div>

<button type="button" id="fbbtn" class="fb-btn" hidden aria-haspopup="dialog" aria-controls="fbpanel">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <span data-i18n="fb_btn"></span>
</button>
<div id="fbpanel" class="fb-panel" role="dialog" aria-labelledby="fbtitle" hidden>
  <div class="fb-head"><span id="fbtitle" data-i18n="fb_title"></span><button type="button" id="fbclose" class="fb-x" data-i18n-aria="fb_close" aria-label="Închide">×</button></div>
  <div class="fb-body" id="fbform">
    <p class="fb-topic" id="fbtopic" hidden></p>
    <label class="sr" for="fbmsg" data-i18n="fb_msg_label"></label>
    <textarea id="fbmsg" rows="5" maxlength="2000" data-i18n-ph="fb_msg_ph"></textarea>
    <label class="sr" for="fbemail" data-i18n="fb_email_label"></label>
    <input type="email" id="fbemail" data-i18n-ph="fb_email_ph" autocomplete="email">
    <input type="text" id="fbhp" class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="fb-check" id="fbprofwrap" hidden><input type="checkbox" id="fbprof"><span id="fbproftxt"></span></label>
    <p class="fb-note" data-i18n="fb_ctx_note"></p>
    <p class="fb-note" data-i18n="fb_privacy"></p>
    <p class="fb-status" id="fbstatus" role="status"></p>
    <button type="button" class="primary fb-send" id="fbsend" data-i18n="fb_send"></button>
  </div>
  <div class="fb-done" id="fbdone" hidden>
    <p class="fb-ok" data-i18n="fb_ok_title"></p>
    <p class="fb-note" data-i18n="fb_ok_text"></p>
    <button type="button" class="ghost" id="fbclose2" data-i18n="fb_close"></button>
  </div>
</div>

function detectLang() {
  try { const s = localStorage.getItem('lang'); if (s && I18N[s]) return s; } catch (e) {}
  return (navigator.language || 'en').toLowerCase().startsWith('ro') ? 'ro' : 'en';
}
let lang = detectLang();

function t(key, vars = {}) {
  const s = (I18N[lang][key] ?? I18N.en[key] ?? key);
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? GLOBAL_VARS[k] ?? ''));
}
function cnt(noun, n) {
  const [one, many] = I18N[lang].nouns[noun];
  const num = n.toLocaleString(lang);
  if (n === 1) return `1 ${one}`;
  const de = lang === 'ro' && (n % 100 === 0 || n % 100 >= 20) ? ' de' : '';
  return `${num}${de} ${many}`;
}

/* ---------- Memorie pe dispozitiv / On-device memory ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
// O „vizită" ține 6 ore: dacă reîncarci pagina în acest interval, marcajele „nou" rămân.
const SESSION_MS = 6 * 60 * 60 * 1000;

function markNew(authorKey, citing) {
  const key = 'seen:' + authorKey;
  const now = Date.now();
  const ids = citing.map((c) => shortId(c.id));
  const rec = store.get(key);
  let baseline = null;
  let currentAt = now;
  if (rec && rec.current) {
    if (now - rec.current.at > SESSION_MS) baseline = rec.current;          // vizită nouă
    else { baseline = rec.baseline || null; currentAt = rec.current.at; }    // aceeași vizită
  }
  const baseSet = baseline ? new Set(baseline.ids) : null;
  let newCount = 0;
  citing.forEach((c) => {
    c.isNew = !!baseSet && !baseSet.has(shortId(c.id));
    if (c.isNew) newCount++;
  });
  const saved = store.set(key, { baseline, current: { ids, at: currentAt } });
  return { hasBaseline: !!baseline, baselineAt: baseline ? baseline.at : null, newCount, saved };
}

/* ---------- OpenAlex ---------- */
async function api(path, params = {}) {
  const u = new URL(API + path);
  for (const k in params) u.searchParams.set(k, params[k]);
  const email = $('email').value.trim();
  if (email) u.searchParams.set('mailto', email);
  let r;
  try { r = await fetch(u); } catch (e) { const ne = new Error('network'); ne.network = true; throw ne; }
  if (!r.ok) { const e = new Error('api'); e.apiCode = r.status; throw e; }
  return r.json();
}
async function apiRetry(path, params, tries = 4) {
  for (let i = 0; ; i++) {
    try { return await api(path, params); }
    catch (err) {
      const retriable = err.network || err.apiCode >= 500 || (err.apiCode === 429 && i < 1);
      if (!retriable || i >= tries - 1) throw err;
      await new Promise((r) => setTimeout(r, err.apiCode === 429 ? 800 : 500 * 2 ** i + Math.random() * 250));
    }
  }
}

function errorKind(err, ctx) {
  if (err.apiCode === 404) return err.orcid || ctx === 'orcid' ? 'orcid_404' : 'not_found';
  if (err.apiCode >= 500) return 'server';
  if (err.apiCode >= 400) return 'rejected';      // 400, 401, 403, 422… (inclusiv dacă OpenAlex schimbă regulile)
  if (err.network) return 'offline';
  return 'unexpected';                              // o greșeală de-a noastră, nu a rețelei
}
const ERR_ACTIONS = { orcid_404: ['edit'], name_none: ['edit'], not_found: ['retry'], server: ['retry'], offline: ['retry'], rejected: ['retry', 'report'], unexpected: ['retry', 'report'] };

    report: FEEDBACK_KEY ? `<button type="button" class="ghost" data-act="report">${esc(t('oops_report'))}</button>` : ''
  };
  const msg = t('err_msg_' + kind, { code: code ? t('err_code', { n: code }) : '' });
  return `<section class="oops" role="alert">
    ${OOPS_IMG ? `<img class="oops-img" src="${OOPS_IMG}" alt="${esc(t('oops_alt'))}" width="640" height="361">` : ''}
    <h2>${esc(t('oops_title'))}</h2>
    <p class="oops-msg">${esc(msg)}</p>
    <div class="oops-actions">${(ERR_ACTIONS[kind] || ['retry']).map((a) => btn[a]).join('')}</div>
  </section>`;
}
function renderError() {

function showErrorState(kind, err) {
  state.loading = null; state.author = null; state.limit = false;
  state.errKind = kind;
  state.errCode = err && err.apiCode ? err.apiCode : 0;
  state.errInfo = err ? (err.apiCode ? 'HTTP ' + err.apiCode : String(err.message || '').slice(0, 160)) : '';
  $('candidates').innerHTML = '';
  setStatus(null);
  renderError();
}

function errorStatus(err, ctx) {
  err = err || {};
  const outage = err.apiCode === 429 || err.apiCode >= 500 || err.network || (err.apiCode >= 400 && err.apiCode !== 404);
  if (!state.author && outage) {
    const snap = findSnapshot();
    if (snap) {
      try { applySnapshot(snap, err.apiCode === 429 ? 'limit' : 'down'); return; }
      catch (e) { try { localStorage.removeItem(SNAP_KEY); } catch (e2) {} state.snapshot = null; state.author = null; }   // copie deteriorată: o aruncăm și arătăm eroarea normală
    }
  }
  // Bugetul zilnic gratuit al partenerului (OpenAlex) s-a terminat: ecran dedicat (cafeaua), nu un mesaj tehnic.
  if (err.apiCode === 429) {
    state.loading = null;
    if (state.author) { flashToast('limit_short'); return; }   // profilul deja afișat rămâne la locul lui
    showLimitState(); return;
  }
  const kind = errorKind(err, ctx);
  if (state.author) { flashToast('err_msg_' + kind, { code: err.apiCode ? t('err_code', { n: err.apiCode }) : '' }); return; }
  showErrorState(kind, err);
}

async function start() {
  state.limit = false;
  state.errKind = null;
  state.snapshot = null;
  state.pendingId = null;
  const text = $('q').value.trim();
  state.candidates = [];
  renderCandidates();
  $('profile').innerHTML = '';
  loadToken++;
  if (fullLoad) fullLoad.cancelled = true;
  state.author = null;
  state.citing = [];
  state.trunc = null;
  state.ind = null;
  state.byWork = new Map();
  if (!text) { setStatus('s_enter', {}, true); return; }
  $('go').disabled = true;
  try {
    const orcid = parseOrcid(text);
    if (orcid) {
      setStatus('s_orcid');
      let a;
      try { a = await api('/authors/orcid:' + orcid); } catch (e) { e.orcid = true; throw e; }   // doar 404-ul căutării ORCID înseamnă „ORCID negăsit"
      await loadAuthor(a);
    } else {
      setStatus('s_search');
      $('candidates').innerHTML = candidatesSkeleton();
      const res = await api('/authors', { search: text, 'per-page': 8, select: 'id,display_name,orcid,works_count,cited_by_count,last_known_institutions' });
      if (!res.results.length) { showErrorState('name_none'); }
      else { setStatus('s_pick'); state.candidates = res.results; renderCandidates(); }
    }
  } catch (err) { errorStatus(err); }
  $('go').disabled = false;
}

  }).join('');
}

});

function lightRecord(c, myWorks, authorId) {
  const names = (c.authorships || []).map((x) => x.author && x.author.display_name).filter(Boolean);
  const rec = {
    id: c.id,
    display_name: c.display_name,
    publication_date: c.publication_date,
    doi: c.doi,
    venue: c.primary_location && c.primary_location.source ? c.primary_location.source.display_name : '',
    srcId: c.primary_location && c.primary_location.source ? c.primary_location.source.id : null,
    srcType: c.primary_location && c.primary_location.source ? c.primary_location.source.type : null,
    fi: null,
    authors: names.slice(0, 40),
    nAuthors: names.length,
    isSelf: (c.authorships || []).some((x) => x.author && x.author.id === authorId),
    isNew: false,
    myWorks
  };
  rec._hay = ((rec.display_name || '') + ' ' + rec.authors.join(' ')).toLowerCase();
  return rec;
}

const srcCache = new Map();   // id revistă -> factor de impact orientativ (sau null)
async function enrichSources(list) {
  const need = [...new Set(list.filter((c) => c.srcId && c.srcType === 'journal' && !srcCache.has(c.srcId)).map((c) => shortId(c.srcId)))];
  for (let i = 0; i < need.length; i += 100) {
    const ids = need.slice(i, i + 100);
    try {
      const r = await apiRetry('/sources', { filter: 'openalex:' + ids.join('|'), 'per-page': 100, select: 'id,summary_stats' });
      const got = new Set();
      r.results.forEach((src) => {
        const v = src.summary_stats && src.summary_stats['2yr_mean_citedness'];
        srcCache.set(src.id, typeof v === 'number' ? v : null);
        got.add(shortId(src.id));
      });
      ids.forEach((id) => { if (!got.has(id)) srcCache.set('https://openalex.org/' + id, null); });
    } catch (e) { break; }   // fără aceste date profilul se afișează normal, doar fără indicatorul orientativ
  }
  list.forEach((c) => { c.fi = c.srcId && srcCache.has(c.srcId) ? srcCache.get(c.srcId) : null; });
}
function fiStats() {
  let sum = 0, n = 0;
  state.citing.forEach((c) => { if (typeof c.fi === 'number') { sum += c.fi; n++; } });
  return { sum, n, m: state.citing.length };
}
const fiFmt = (v) => v.toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const byDateDesc = (x, y) => (y.publication_date || '').localeCompare(x.publication_date || '') || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0);

function indexByWork() {
  const m = new Map();
  state.citing.forEach((c) => c.myWorks.forEach((w) => {
    if (!m.has(w.id)) m.set(w.id, []);
    m.get(w.id).push(c);
  }));
  state.byWork = m;
  state.workShown = {};
}

async function loadAuthor(a) {
  const token = ++loadToken;
  if (fullLoad) fullLoad.cancelled = true;
  state.pendingId = a.id;
  const aid = shortId(a.id);
  showLoading(a);

  let works = [];
  for (let page = 1; page <= 5; page++) {
    ldUpdate({ step: 1, n: works.length });
    const r = await apiRetry('/works', {
      filter: 'author.id:' + aid, sort: 'cited_by_count:desc', 'per-page': 200, page,
      select: 'id,display_name,publication_year,cited_by_count,doi,referenced_works,type,primary_location'
    });
    if (token !== loadToken) return;
    works = works.concat(r.results);
    if (r.results.length < 200) break;
  }

  works.forEach(slimWork);
  const ind = computeIndicators(works);
  works.forEach((w) => { delete w.referenced_works; });

  const cited = works.filter((w) => w.cited_by_count > 0);
  const map = new Map();
  const BATCH = 40;
  let batches = 0, totalSum = 0, cutoff = '', batchTruncated = false;
  for (let i = 0; i < cited.length; i += BATCH) {
    const ids = cited.slice(i, i + BATCH).map((w) => shortId(w.id)).join('|');
    batches++;
    let got = 0, metaCount = 0, oldest = '';
    for (let page = 1; page <= 5; page++) {
      ldUpdate({ step: 2, total: cited.length });
      const r = await apiRetry('/works', {
        filter: 'cites:' + ids, sort: 'publication_date:desc', 'per-page': 200, page,
        select: 'id,display_name,publication_date,doi,authorships,primary_location,referenced_works'
      });
      if (token !== loadToken) return;
      metaCount = (r.meta && r.meta.count) || metaCount;
      r.results.forEach((c) => map.set(c.id, c));
      const pagesTotal = Math.max(1, Math.min(5, Math.ceil(metaCount / 200)));
      const frac = (i / BATCH + page / pagesTotal) / Math.max(1, Math.ceil(cited.length / BATCH));
      ldUpdate({ found: map.size, pct: Math.min(99, Math.round(frac * 100)), done: Math.min(cited.length, Math.round(frac * cited.length)) });
      got += r.results.length;
      const last = r.results[r.results.length - 1];
      if (last && last.publication_date) oldest = last.publication_date;
      if (r.results.length < 200) break;
    }
    totalSum += metaCount || got;
    if (metaCount > got) { batchTruncated = true; if (oldest > cutoff) cutoff = oldest; }
  }

  const mine = new Map(works.map((w) => [w.id, w]));
  let list = [...map.values()].map((c) => lightRecord(
    c, (c.referenced_works || []).filter((id) => mine.has(id)).map((id) => mine.get(id)), a.id
  )).sort(byDateDesc);

  let truncated = false;
  if (batchTruncated && cutoff) { list = list.filter((c) => (c.publication_date || '') >= cutoff); truncated = true; }
  if (list.length > CITING_CAP) { list = list.slice(0, CITING_CAP); truncated = true; }
  const total = batchTruncated ? totalSum : map.size;
  await enrichSources(list);
  if (token !== loadToken) return;

  state.author = a;
  state.rank = null;
  state.works = works;
  state.ind = ind;
  state.trunc = truncated ? { shown: list.length, total: Math.max(total, list.length), exact: !batchTruncated || batches === 1 } : null;
  state.visit = markNew(aid, list);
  state.citing = list;
  indexByWork();
  store.set('last', { id: aid, label: a.display_name, orcid: parseOrcid(a.orcid) });

  state.page = 1;
  state.tab = 'feed';
  state.filter = '';
  state.onlyNew = false;
  state.loading = null;
  state.snapshot = null;
  setStatus(null);
  render();
  saveSnapshot();
}

/* Încarcă TOATE citările, pe cursor, câte o lucrare. Returnează true dacă s-a terminat. */
function loadAllCitations() {
  if (!FULL_LOAD || state.snapshot) return Promise.resolve(false);
  if (fullLoad) return fullLoad.promise;
  if (!state.author) return Promise.resolve(false);
  if (!state.trunc) return Promise.resolve(true);
  const ctl = { cancelled: false, found: 0, links: 0, totalLinks: 0, promise: null };
  fullLoad = ctl;
  ctl.promise = runFullLoad(ctl);
  render();
  return ctl.promise;
}

async function runFullLoad(ctl) {
  const token = loadToken;
  const a = state.author;
  const cited = state.works.filter((w) => w.cited_by_count > 0);
  ctl.totalLinks = cited.reduce((n, w) => n + w.cited_by_count, 0);
  const map = new Map();
  let next = 0;
  const worker = async () => {
    while (!ctl.cancelled) {
      const w = cited[next++];
      if (!w) return;
      let cursor = '*';
      while (cursor && !ctl.cancelled) {
        const r = await apiRetry('/works', {
          filter: 'cites:' + shortId(w.id), 'per-page': 200, cursor,
          select: 'id,display_name,publication_date,doi,authorships,primary_location'
        });
        if (ctl.cancelled) return;
        r.results.forEach((c) => {
          let rec = map.get(c.id);
          if (!rec) { rec = lightRecord(c, [], a.id); map.set(c.id, rec); }
          rec.myWorks.push(w);
        });
        ctl.links += r.results.length;
        ctl.found = map.size;
        cursor = r.results.length && r.meta && r.meta.next_cursor ? r.meta.next_cursor : null;
        paintProgress(ctl);
      }
    }
  };
  let ok = false;
  try {
    await Promise.all([worker(), worker(), worker()]);
    ok = !ctl.cancelled && token === loadToken;
  } catch (err) {
    ctl.cancelled = true;
    if (token === loadToken) errorStatus(err);
  }
  fullLoad = null;
  if (ok) {
    const prevNew = new Set(state.citing.filter((c) => c.isNew).map((c) => c.id));
    const list = [...map.values()].sort(byDateDesc);
    list.forEach((c) => { c.isNew = prevNew.has(c.id); });
    await enrichSources(list);
    if (token !== loadToken) return false;
    state.citing = list;
    state.trunc = null;
    state.page = 1;
    indexByWork();
  }
  if (token === loadToken && state.author) render();
  return ok;
}

function paintProgress(ctl) {
  const bar = $('lp-bar'), txt = $('lp-text');
  if (!bar || !txt) return;
  const pct = ctl.totalLinks ? Math.min(99, Math.round((ctl.links / ctl.totalLinks) * 100)) : 0;
  bar.value = pct;
  txt.textContent = t('loading_all', { pct, found: ctl.found.toLocaleString(lang) });
}

/* ---------- Afișare / Rendering ---------- */
function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(lang === 'ro' ? 'ro-RO' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
}

function postHtml(c, showMine = true) {
  const by = c.authors.slice(0, 3).join(', ') + (c.nAuthors > 3 ? ' ' + t('and_others') : '');
  const newTag = c.isNew ? `<span class="newtag">${t('new_tag')}</span>` : '';
  const fiTag = typeof c.fi === 'number' ? `<span class="fi" title="${esc(t('fi_title'))}">${esc(t('fi_short'))} ≈ ${fiFmt(c.fi)}</span>` : '';
  const kicker = newTag + [c.venue ? esc(c.venue) : '', fiTag, esc(fmtDate(c.publication_date))].filter(Boolean).join(' · ');
  const link = safeUrl(c.doi) || safeUrl(c.id);
  let pills = '';
  if (showMine || c.isSelf) {
    const mineP = showMine ? `<span class="lab">${t('cites_label')}</span>` + c.myWorks.map((w) => `<span class="pill" title="${esc(w.display_name)}">${esc(w.display_name)}</span>`).join('') : '';
    const selfP = c.isSelf ? `<span class="pill self">${t('self_tag')}</span>` : '';
    pills = `<div class="pills">${mineP}${selfP}</div>`;
  }
  return `<article class="post">
    <div class="kicker">${kicker}</div>
    <h3 class="ptitle">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(c.display_name || t('no_title'))}</a>` : esc(c.display_name || t('no_title'))}</h3>
    <p class="by">${esc(by)}</p>
    ${pills}
  </article>`;
}

function filteredCiting() {
  const f = state.filter.trim().toLowerCase();
  return state.citing.filter((c) => {
    if (state.hideSelf && c.isSelf) return false;
    if (state.onlyNew && !c.isNew) return false;
    return !f || c._hay.includes(f);
  });
}

function chartHtml() {
  const years = new Map();
  state.citing.forEach((c) => {
    const y = parseInt((c.publication_date || '').slice(0, 4), 10);
    if (!y) return;
    const o = years.get(y) || { o: 0, s: 0 };
    if (c.isSelf) o.s++; else o.o++;
    years.set(y, o);
  });
  if (!years.size) return `<p class="empty">${t('empty_none')}</p>`;

  const max = Math.max(...years.keys());
  let min = Math.min(...years.keys());
  if (max - min > 39) min = max - 39;
  const data = [];
  for (let y = min; y <= max; y++) {
    const o = years.get(y) || { o: 0, s: 0 };
    data.push({ y, o: o.o, s: o.s, t: o.o + o.s });
  }
  const top = Math.max(...data.map((d) => d.t), 1);
  const W = 640, H = 250, pt = 22, pb = 28, pl = 6, pr = 6;
  const iw = W - pl - pr, ih = H - pt - pb, yb = pt + ih;
  const bw = iw / data.length, w = Math.min(bw * 0.72, 56);
  const step = Math.ceil(data.length / 12);
  const anySelf = data.some((d) => d.s);

  let bars = '';
  data.forEach((d, i) => {
    const x = pl + i * bw + (bw - w) / 2;
    const ho = (d.o / top) * ih, hs = (d.s / top) * ih;
    bars += `<g class="col" style="--d:${i * 45}ms"><title>${esc(d.y + ': ' + cnt('article', d.t))}</title>`;
    if (d.o) bars += `<rect class="bar-o" x="${x.toFixed(1)}" y="${(yb - ho).toFixed(1)}" width="${w.toFixed(1)}" height="${ho.toFixed(1)}" rx="2"/>`;
    if (d.s) bars += `<rect class="bar-s" x="${x.toFixed(1)}" y="${(yb - ho - hs).toFixed(1)}" width="${w.toFixed(1)}" height="${hs.toFixed(1)}" rx="2"/>`;
    if (d.t && data.length <= 24) bars += `<text class="val" x="${(x + w / 2).toFixed(1)}" y="${(yb - ho - hs - 6).toFixed(1)}" text-anchor="middle">${d.t}</text>`;
    if ((data.length - 1 - i) % step === 0) bars += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${d.y}</text>`;
    bars += '</g>';
  });

  return `<div class="chart-wrap">
    <p class="chart-cap">${t('chart_cap')}</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('chart_cap'))}">
      <line class="axis" x1="${pl}" y1="${yb}" x2="${W - pr}" y2="${yb}"/>
      ${bars}
    </svg>
    ${anySelf ? `<div class="legend"><span><i class="sw"></i>${t('legend_other')}</span><span><i class="sw s"></i>${t('legend_self')}</span></div>` : ''}
  </div>`;
}

/* ---------- Export: ZIP minimal, fără biblioteci externe ---------- */
const CRC_TABLE = (() => {
  const tb = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; }
  return tb;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

async function deflateRaw(bytes) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) { return null; }
}

async function makeZip(files, mime) {
  const enc = new TextEncoder();
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    let body = data, method = 0;
    const comp = await deflateRaw(data);          // comprimat dacă browserul o permite, altfel stocat
    if (comp && comp.length < data.length) { body = comp; method = 8; }
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, method, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, body.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, body);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, method, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, body.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime });
}

const xe = (s) => String(s ?? '')
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const MIME_DOCX = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

function exportRows() {
  const L = I18N[lang];
  return [L.csv_head].concat(state.citing.map((c) => [
    c.publication_date || '',
    c.display_name || '',
    c.authors.join('; ') + (c.nAuthors > c.authors.length ? '; …' : ''),
    c.venue || '',
    typeof c.fi === 'number' ? Math.round(c.fi * 1000) / 1000 : '',
    safeUrl(c.doi) || safeUrl(c.id),
    c.myWorks.map((w) => w.display_name).join(' | '),
    c.isSelf ? L.yes : L.no,
    c.isNew ? L.yes : L.no
  ]));
}

function fileName(ext) {
  const slug = (state.author.display_name || 'profil').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
  return `${I18N[lang].csv_name}-${slug}-${new Date().toISOString().slice(0, 10)}.${ext}`;
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function withBusy(fn) {
  showToast('exporting');
  await new Promise((r) => setTimeout(r, 60));   // lăsăm interfața să afișeze mesajul
  try { await fn(); hideToast(); }
  catch (e) { flashToast('err_export'); }
}

/* ----- CSV ----- */
function exportCsv() {
  if (!state.author || !state.citing.length) return;
  return withBusy(async () => {
    const sep = lang === 'ro' ? ';' : ',';   // Excel în română folosește „;" ca separator
    const cell = (v) => {
      let s = typeof v === 'number' && lang === 'ro' ? String(v).replace('.', ',') : String(v ?? '');
      if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;      // neutralizează formulele (CSV injection)
      return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = '\ufeff' + exportRows().map((r) => r.map(cell).join(sep)).join('\r\n');
    downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fileName('csv'));
  });
}

/* ----- Excel (.xlsx) ----- */
async function buildXlsx(sheets) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const col = (i) => String.fromCharCode(65 + i);
  const sheetXml = (sh, idx) => {
    const cols = sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
    const data = sh.rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = `${col(ci)}${ri + 1}`;
      if (typeof v === 'number') return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${xe(String(v ?? '').slice(0, 32000))}</t></is></c>`;
    }).join('') + '</row>').join('');
    const pane = sh.freeze ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : '';
    return `${XML_HEAD}<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"${idx === 0 ? ' tabSelected="1"' : ''}>${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${cols}</cols><sheetData>${data}</sheetData></worksheet>`;
  };
  const styles = `${XML_HEAD}<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const n = sheets.length;
  const overrides = sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  const sheetTags = sheets.map((sh, i) => `<sheet name="${xe(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  const wbRels = sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${n + 1}" Type="${REL}/styles" Target="styles.xml"/>`;
  return makeZip([
    { name: '[Content_Types].xml', data: `${XML_HEAD}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrides}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', data: `${XML_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `${XML_HEAD}<workbook xmlns="${NS}" xmlns:r="${REL}"><sheets>${sheetTags}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `${XML_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels}</Relationships>` },
    { name: 'xl/styles.xml', data: styles },
    ...sheets.map((sh, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(sh, i) }))
  ], MIME_XLSX);
}
function indicatorRows() {
  const I = state.ind;
  return [
    [t('ind_col_name'), t('ind_col_total'), t('ind_col_noself')],
    [t('ind_works'), I.works, ''],
    [t('ind_cites'), I.total, I.noself],
    [t('ind_h'), I.h, I.hNo],

/* ----- Word (.docx) ----- */
async function buildDocx(limit = Infinity) {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const a = state.author;
  const rels = [];   // hyperlinkuri externe
  const items = state.citing.slice(0, limit);

  const run = (text, o = {}) => `<w:r><w:rPr>${o.b ? '<w:b/>' : ''}${o.i ? '<w:i/>' : ''}${o.color ? `<w:color w:val="${o.color}"/>` : ''}${o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : ''}${o.u ? '<w:u w:val="single"/>' : ''}</w:rPr><w:t xml:space="preserve">${xe(text)}</w:t></w:r>`;
  const para = (inner, o = {}) => `<w:p><w:pPr>${o.style ? `<w:pStyle w:val="${o.style}"/>` : ''}${o.keep ? '<w:keepNext/>' : ''}${(o.before != null || o.after != null) ? `<w:spacing${o.before != null ? ` w:before="${o.before}"` : ''}${o.after != null ? ` w:after="${o.after}"` : ''}/>` : ''}</w:pPr>${inner}</w:p>`;
  const link = (url, inner) => { rels.push(url); return `<w:hyperlink r:id="rId${rels.length + 1}" w:history="1">${inner}</w:hyperlink>`; };

  const GRAY = '6B6B6B', TEAL = '114852';
  const date = new Date().toLocaleDateString(lang === 'ro' ? 'ro-RO' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
  let body = para(run(t('docx_title', { name: a.display_name })), { style: 'Title' });
  body += para(run(t('doc_meta', { works: cnt('work', state.works.length), articles: articlesLabel() }), { color: GRAY }), { after: 40 });
  if (state.trunc) body += para(run(t(state.trunc.exact ? 'trunc_exact' : 'trunc_approx', { shown: state.trunc.shown.toLocaleString(lang), total: cnt('article', state.trunc.total) }), { color: GRAY, sz: 20, i: 1 }), { after: 40 });
  if (items.length < state.citing.length) body += para(run(t('doc_cap', { n: cnt('article', items.length) }), { color: GRAY, sz: 20, i: 1 }), { after: 40 });
  body += para(run(t('doc_generated', { date }), { color: GRAY, sz: 20 }), { after: 200 });
  if (state.ind && state.ind.works) {
    const I = state.ind, n = (v) => v.toLocaleString(lang);
    const line = (label, val, sub) => para(run(label + ': ', { b: 1 }) + run(n(val)) + (sub != null ? run('  (' + t('ind_noself', { n: n(sub) }) + ')', { color: GRAY }) : ''), { after: 40 });
    body += para(run(t('ind_aria')), { style: 'Heading2', keep: true });
    body += line(t('ind_works'), I.works) + line(t('ind_cites'), I.total, I.noself) + line(t('ind_h'), I.h, I.hNo) + line(t('ind_i10'), I.i10, I.i10No);
    const F = fiStats();
    if (F.n) {
      body += para(run(t('ind_fi') + ': ', { b: 1 }) + run(fiFmt(F.sum)) + run('  (' + t('ind_fi_sub', { n: n(F.n), m: n(F.m) }) + ')', { color: GRAY }), { after: 40 });
      body += para(run(t('fi_note_doc') + ' ' + t('fi_open'), { color: GRAY, sz: 20, i: 1 }), { before: 20, after: 40 });
    }
    body += para(run(t('ind_source'), { color: GRAY, sz: 20, i: 1 }), { before: 60, after: 200 });
  }

  const groups = new Map();
  items.forEach((c) => {
    const y = (c.publication_date || '').slice(0, 4);
    if (!groups.has(y)) groups.set(y, []);
    groups.get(y).push(c);
  });

  groups.forEach((list, y) => {
    body += para(run((y || t('doc_nodate')) + ' · ' + cnt('article', list.length)), { style: 'Heading2', keep: true });
    list.forEach((c) => {
      const url = safeUrl(c.doi) || safeUrl(c.id);
      const titleRun = run(c.display_name || t('no_title'), url ? { b: 1, color: TEAL, u: 1 } : { b: 1 });
      let head = url ? link(url, titleRun) : titleRun;
      if (c.isSelf) head += run(' (' + t('self_tag') + ')', { color: GRAY, sz: 20 });
      if (c.isNew) head += run(' [' + t('new_tag') + ']', { b: 1, color: TEAL, sz: 20 });
      body += para(head, { keep: true, before: 160, after: 20 });

      const by = c.authors.slice(0, 6).join(', ') + (c.nAuthors > 6 ? ' ' + t('and_others') : '');
      const info = [by, c.venue, typeof c.fi === 'number' ? t('fi_short') + ' ≈ ' + fiFmt(c.fi) : '', fmtDate(c.publication_date)].filter(Boolean).join(' · ');
      if (info) body += para(run(info, { color: GRAY, sz: 20 }), { after: 20 });
      if (c.myWorks.length) body += para(run(t('doc_cites') + ': ' + c.myWorks.map((w) => w.display_name).join('; '), { i: 1, color: GRAY, sz: 20 }), { after: 40 });
    });
  });

  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
  const docXml = `${XML_HEAD}<w:document xmlns:w="${W}" xmlns:r="${REL}"><w:body>${body}${sect}</w:body></w:document>`;
  const langTag = lang === 'ro' ? 'ro-RO' : 'en-GB';
  const styles = `${XML_HEAD}<w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="${langTag}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="120"/></w:pPr><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia" w:cs="Georgia"/><w:b/><w:sz w:val="48"/><w:szCs w:val="48"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia" w:cs="Georgia"/><w:b/><w:color w:val="${TEAL}"/><w:sz w:val="30"/><w:szCs w:val="30"/></w:rPr></w:style></w:styles>`;
  const relXml = `${XML_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/styles" Target="styles.xml"/>${rels.map((u, i) => `<Relationship Id="rId${i + 2}" Type="${REL}/hyperlink" Target="${xe(u)}" TargetMode="External"/>`).join('')}</Relationships>`;
  return makeZip([
    { name: '[Content_Types].xml', data: `${XML_HEAD}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>` },
    { name: '_rels/.rels', data: `${XML_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/></Relationships>` },
    { name: 'word/document.xml', data: docXml },
    { name: 'word/styles.xml', data: styles },
    { name: 'word/_rels/document.xml.rels', data: relXml }
  ], MIME_DOCX);
}
function exportDocx(arg) {
  if (!state.author || !state.citing.length) return;
  const n = arg === undefined || arg === 'all' ? Infinity : parseInt(arg, 10);

function setDl(open, focusFirst) {
  const menu = $('dlmenu'), btn = $('dlbtn');
  if (!menu || !btn) return;

const DL_ACTIONS = {
  xlsx: () => exportXlsx(),

  if (e.target.closest && e.target.closest('#dlbtn')) {
    const open = $('dlmenu').hidden;

document.addEventListener('keydown', (e) => {
  const menu = $('dlmenu');
  if (!menu || menu.hidden) return;

  if (e.key === 'Escape') { setDl(false); $('dlbtn').focus(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Tab') { setDl(false); }
});

/* ---------- Indicatori / Indicators ---------- */
// Autocitare = citare dintr-o altă lucrare a aceluiași autor. O calculăm exact din referințele
// propriilor lucrări (nu depinde de câte citări am încărcat în listă).
function hIndex(counts) {
  const a = counts.slice().sort((x, y) => y - x);
  let h = 0;
  while (h < a.length && a[h] >= h + 1) h++;
  return h;
}
function computeIndicators(works) {
  const ids = new Set(works.map((w) => w.id));
  const self = new Map();
  works.forEach((a) => (a.referenced_works || []).forEach((r) => {
    if (r !== a.id && ids.has(r)) self.set(r, (self.get(r) || 0) + 1);
  }));
  const total = [], clean = [];
  works.forEach((w) => {
    const c = w.cited_by_count || 0;
    const sc = Math.min(self.get(w.id) || 0, c);
    w.selfCites = sc;
    total.push(c); clean.push(c - sc);
  });
  const sum = (arr) => arr.reduce((n, v) => n + v, 0);
  return {
    works: works.length,
    total: sum(total), noself: sum(clean),
    h: hIndex(total), hNo: hIndex(clean),
    i10: total.filter((v) => v >= 10).length, i10No: clean.filter((v) => v >= 10).length
  };
}

}

/* ---------- Tooltip comun pentru butoanele „?" ---------- */
let pinnedTip = null;
function showTip(btn) {
  const box = $('tipbox');
  box.textContent = btn.dataset.tip || '';
  box.hidden = false;
  const r = btn.getBoundingClientRect(), b = box.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.min(Math.max(12, r.left + r.width / 2 - b.width / 2), Math.max(12, vw - b.width - 12));
  let top = r.bottom + 8;
  if (top + b.height > vh - 12 && r.top - b.height - 8 > 12) top = r.top - b.height - 8;   // dacă nu încape dedesubt, îl punem deasupra
  box.style.left = left + 'px';
  box.style.top = top + 'px';
}
function hideTip() { pinnedTip = null; const box = $('tipbox'); if (box) box.hidden = true; }
const tipBtn = (e) => (e.target && e.target.closest ? e.target.closest('.info') : null);
document.addEventListener('mouseover', (e) => { const b = tipBtn(e); if (b && !pinnedTip) showTip(b); });
document.addEventListener('mouseout', (e) => { const b = tipBtn(e); if (b && !pinnedTip) $('tipbox').hidden = true; });
document.addEventListener('focusin', (e) => { const b = tipBtn(e); if (b) showTip(b); });
document.addEventListener('focusout', (e) => { const b = tipBtn(e); if (b && !pinnedTip) $('tipbox').hidden = true; });
document.addEventListener('click', (e) => {
  const b = tipBtn(e);
  if (b) { if (pinnedTip === b) hideTip(); else { pinnedTip = b; showTip(b); } return; }
  if (pinnedTip) hideTip();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', () => { if ($('tipbox') && !$('tipbox').hidden) hideTip(); }, { passive: true });
window.addEventListener('resize', hideTip);

function pagerHtml(page, pages) {
  if (pages <= 1) return '';
  const set = new Set([1, pages]);
  for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= pages) set.add(i);
  const nums = [...set].sort((x, y) => x - y);
  let out = `<button type="button" class="pg" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="${esc(t('prev'))}">‹</button>`;
  let prev = 0;
  nums.forEach((n) => {
    if (n - prev > 1) out += '<span class="gap">…</span>';
    out += `<button type="button" class="pg" data-page="${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`;
    prev = n;
  });
  out += `<button type="button" class="pg" data-page="${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="${esc(t('next'))}">›</button>`;
  const jump = pages > 12 ? `<label class="jump">${t('go_to')} <input type="number" id="jump" min="1" max="${pages}" value="${page}"></label>` : '';
  return `<nav class="pager" aria-label="${esc(t('pager'))}">${out}${jump}</nav>`;
}

  const tabsEl = $('profile').querySelector('.tabs'), actTab = tabsEl && tabsEl.querySelector('[aria-selected=true]');
  if (tabsEl && actTab && actTab.offsetLeft + actTab.offsetWidth > tabsEl.clientWidth) tabsEl.scrollLeft = actTab.offsetLeft + actTab.offsetWidth - tabsEl.clientWidth;

  $('profile').querySelectorAll('[data-page]').forEach((b) => b.onclick = () => { state.page = +b.dataset.page; render(); scrollToTabs(); });
  const jump = $('jump');
  if (jump) jump.onkeydown = (e) => {

    const n = parseInt(jump.value, 10);
    if (n >= 1) { state.page = n; render(); scrollToTabs(); }

  const f = $('f');
  if (f) {

  }
  const la = $('loadall');
  if (la) la.onclick = () => loadAllCitations();
  const sr = $('snap-retry'); if (sr) sr.onclick = () => start();
  const cancel = $('lp-cancel');
  if (cancel) cancel.onclick = () => { if (fullLoad) fullLoad.cancelled = true; };
  if (fullLoad) paintProgress(fullLoad);
}

/* ---------- Unde publici: cuartile SCImago (Scopus) ---------- */
const SJR_URL = 'sjr-2025.json';          // tabel opțional, pus lângă index.html (vezi explicația din răspuns)
const SJR_STORE = 'sjr1';
const PUB_TYPES = new Set(['article', 'review']);
const normIssn = (x) => String(x || '').replace(/[^0-9xX]/g, '').toUpperCase();
const normTitle = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
let SJR = null, sjrBusy = false, sjrErr = '';

function slimWork(w) {            // păstrăm doar ce trebuie din fiecare lucrare: tipul, tipul sursei, ISSN-urile, titlul normalizat
  const src = w.primary_location && w.primary_location.source;
  w.jt = w.type || '';
  w.sty = src ? (src.type || '') : '';
  w.is = src ? [...new Set([...(src.issn || []), src.issn_l].filter(Boolean).map(normIssn).filter((x) => /^[0-9]{7}[0-9X]$/.test(x)))] : [];
  w.tn = normTitle(w.display_name);
  delete w.type; delete w.primary_location;
}

function sjrFromPacked(o, source) {
  const map = new Map();
  Object.keys(o.q).forEach((k) => { const str = o.q[k]; for (let i = 0; i + 8 <= str.length; i += 8) map.set(str.slice(i, i + 8), +k); });
  return { map, year: o.year, n: map.size, source };
}
function packSjr(map, year) {
  const g = { 0: [], 1: [], 2: [], 3: [], 4: [] };
  map.forEach((q, k) => g[q].push(k));
  const q = {}; Object.keys(g).forEach((k) => { q[k] = g[k].sort().join(''); });
  return { v: 1, year, n: map.size, q };
}
function parseSjrCsv(text) {       // CSV-ul SCImago: separat cu „;", ghilimele pentru câmpuri, ISSN-uri fără cratimă
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const n = text.length; let i = 0;
  const record = () => {
    const f = []; let cur = '', q = false;
    while (i < n) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i += 2; continue; } q = false; i++; continue; } cur += c; i++; continue; }
      if (c === '"') { q = true; i++; continue; }
      if (c === ';') { f.push(cur); cur = ''; i++; continue; }
      if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; i++; f.push(cur); return f; }
      cur += c; i++;
    }
    f.push(cur); return f;
  };
  const head = record().map((h) => h.trim().toLowerCase());
  const iI = head.indexOf('issn'), iQ = head.indexOf('sjr best quartile');
  const yh = head.map((h) => (h.match(/^total docs\.\s*\((\d{4})\)/) || [])[1]).find(Boolean);
  if (iI < 0 || iQ < 0) throw new Error('bad');
  const map = new Map();
  while (i < n) {
    const r = record();
    if (r.length <= Math.max(iI, iQ)) continue;
    const qm = /^Q([1-4])$/.exec(r[iQ].trim()), q = qm ? +qm[1] : 0;
    r[iI].split(/[,\s]+/).forEach((p) => {
      const k = normIssn(p);
      if (!/^[0-9]{7}[0-9X]$/.test(k)) return;
      const old = map.get(k);
      if (old === undefined || (old === 0 && q > 0) || (q > 0 && q < old)) map.set(k, q);
    });
  }
  if (map.size < 100) throw new Error('bad');
  return { map, year: yh ? +yh : null };
}
function loadSjrFromStore() {
  const o = store.get(SJR_STORE);
  if (o && o.v === 1 && o.q) SJR = sjrFromPacked(o, 'upload');
}
async function loadSjrHosted() {
  if (SJR || location.protocol === 'file:') return;
  try {
    const r = await fetch(SJR_URL);
    if (!r.ok) return;
    const o = await r.json();
    if (!(o && o.v === 1 && o.q) || SJR) return;
    SJR = sjrFromPacked(o, 'site');
    if (state.author && state.tab === 'chart') render();
  } catch (e) { /* fără tabel pus de noi: rămâne încărcarea de către utilizator */ }
}
async function onSjrFile(file) {
  sjrBusy = true; sjrErr = ''; render();
  await new Promise((r) => setTimeout(r, 30));
  try {
    const parsed = parseSjrCsv(await file.text());
    SJR = { map: parsed.map, year: parsed.year, n: parsed.map.size, source: 'upload' };
    store.set(SJR_STORE, { ...packSjr(parsed.map, parsed.year), at: Date.now() });
  } catch (e) { sjrErr = 'sj_bad'; }
  sjrBusy = false; render();
}
function removeSjr() {
  try { localStorage.removeItem(SJR_STORE); } catch (e) {}
  SJR = null; loadSjrHosted(); render();
}

function pubStats() {
  if (!SJR) return null;
  const c = { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 }, years = new Map(), seen = new Set();
  let other = 0, dup = 0, absent = 0, noq = 0, counted = 0;
  state.works.forEach((w) => {
    if (!(PUB_TYPES.has(w.jt) && w.sty === 'journal')) { other++; return; }
    if (w.tn && seen.has(w.tn)) { dup++; return; }
    if (w.tn) seen.add(w.tn);
    let q = 0, found = false;
    (w.is || []).forEach((k) => { const v = SJR.map.get(k); if (v === undefined) return; found = true; if (v > 0 && (q === 0 || v < q)) q = v; });
    c[q]++; counted++;
    if (!q) { if (found) noq++; else absent++; }
    if (w.publication_year) { const y = years.get(w.publication_year) || { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 }; y[q]++; years.set(w.publication_year, y); }
  });
  return { c, years, other, dup, absent, noq, counted };
}
function pubGrowth(P) {      // ponderea Q1 în ultimii 3 ani față de înainte, din articolele cu cuartilă
  const y0 = new Date().getFullYear() - 2, a = { q1: 0, n: 0 }, b = { q1: 0, n: 0 };
  P.years.forEach((v, y) => { const t3 = v[1] + v[2] + v[3] + v[4], o = y >= y0 ? a : b; o.q1 += v[1]; o.n += t3; });
  if (a.n < 3 || b.n < 3) return null;
  return { recent: Math.round(a.q1 / a.n * 100), before: Math.round(b.q1 / b.n * 100) };
}
function pubHtml() {
  const tipNote = SJR ? t('sj_note', { year: SJR.year || '' }) : t('sj_note', { year: '' });
  const head = `<h3 class="st-h">${esc(t('st_h_pub'))}${infoBtn(t('st_h_pub'), tipNote)}</h3>`;
  const fileInput = '<input type="file" id="sj-file" accept=".csv,text/csv,.txt" hidden>';
  const need = () => `<div class="sj-need"><p class="sj-need-t">${esc(t('sj_need_title'))}</p><p>${esc(t('sj_need_text'))}</p>
      ${sjrErr ? `<p class="sj-err">${esc(t(sjrErr))}</p>` : ''}
      <div class="sj-actions"><button type="button" class="ghost" id="sj-up">${esc(t('sj_upload'))}</button><a href="https://www.scimagojr.com/journalrank.php" target="_blank" rel="noopener">${esc(t('sj_open'))}</a></div></div>`;
  if (sjrBusy) return head + `<p class="sj-sum" role="status">${esc(t('sj_loading'))}</p>`;
  if (!SJR) return head + need() + fileInput;
  const P = pubStats(), n = (v) => v.toLocaleString(lang);
  const foot = `<p class="sj-foot">${esc(t('sj_loaded', { year: SJR.year || '?', n: n(SJR.n) }))} <a href="https://www.scimagojr.com" target="_blank" rel="noopener">SCImago</a>${SJR.source === 'upload' ? ` · <button type="button" class="linkbtn" id="sj-rm">${esc(t('sj_remove'))}</button>` : ''} · <button type="button" class="linkbtn" id="sj-up">${esc(t('sj_replace'))}</button></p>${fileInput}`;
  if (!P.counted) return head + `<p class="empty">${esc(t('sj_empty'))}</p>` + foot;
  const max = Math.max(...[1, 2, 3, 4, 0].map((q) => P.c[q]), 1);
  const rows = [1, 2, 3, 4, 0].map((q) => {
    const cnt = P.c[q], pct = Math.round(cnt / P.counted * 100), w = Math.max(cnt ? 2 : 0, Math.round(cnt / max * 100));
    const label = q ? 'Q' + q : '—';
    const name = q ? '' : `<span class="sj-name">${esc(t('sj_none_row'))}${infoBtn(t('sj_none_row'), t('sj_tip_none', { a: P.absent, b: P.noq }))}</span>`;
    return `<div class="sj-row${q ? '' : ' sj-none'}" data-q="${q}" data-count="${cnt}"><span class="sj-chip sj-q${q}">${label}</span><div class="sj-track">${q ? '' : name}<span class="sj-bar sj-q${q}" style="width:${w}%"></span></div><span class="sj-n"><b>${n(cnt)}</b> · ${pct}%</span></div>`;
  }).join('');
  const ys = [...P.years.keys()].sort((a, b) => a - b), last = ys[ys.length - 1], first = Math.max(ys[0], last - 9);
  const cols = []; for (let y = first; y <= last; y++) cols.push([y, P.years.get(y) || { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 }]);
  const maxT = Math.max(...cols.map(([, v]) => v[0] + v[1] + v[2] + v[3] + v[4]), 1);
  const stack = cols.map(([y, v]) => {
    const tot = v[0] + v[1] + v[2] + v[3] + v[4];
    const segs = [4, 3, 2, 1, 0].map((q) => v[q] ? `<div class="sj-seg sj-q${q}" style="height:${Math.max(3, Math.round(v[q] / maxT * 110))}px" title="${q ? 'Q' + q : esc(t('sj_none_row'))}: ${v[q]}"></div>` : '').join('');
    return `<div class="sj-ycol" data-year="${y}" data-total="${tot}"><span class="sj-ytot">${tot || ''}</span>${segs}<span class="sj-ylab">${y}</span></div>`;
  }).join('');
  const g = pubGrowth(P);
  const excluded = [P.other ? t('sj_ex_other', { x: P.other }) : '', P.dup ? t('sj_ex_dup', { d: P.dup }) : ''].filter(Boolean).join(' ');
  return head + `<p class="sj-sum">${esc(t('sj_counted', { n: n(P.counted), total: n(state.works.length) }))} ${esc(excluded)}</p>
    <div class="sj-rows">${rows}</div>
    <p class="sj-yh">${esc(t('sj_year_h'))}</p>
    <div class="sj-years" role="img" aria-label="${esc(t('sj_year_h'))}">${stack}</div>
    ${g ? `<p class="sj-growth">${esc(t('sj_growth', g))}</p>` : ''}
    ${foot}`;
}
function bindStats() {
  const up = $('sj-up'), fi = $('sj-file');
  if (up && fi) { up.onclick = () => fi.click(); fi.onchange = () => { if (fi.files && fi.files[0]) onSjrFile(fi.files[0]); }; }
  const rm = $('sj-rm'); if (rm) rm.onclick = removeSjr;

const SNAP_KEY = 'snap1';
function saveSnapshot() {
  const a = state.author;
  if (!a || state.snapshot) return;
  const inst = a.last_known_institutions && a.last_known_institutions[0];
  store.set(SNAP_KEY, {
    savedAt: Date.now(),
    author: { id: a.id, display_name: a.display_name, orcid: a.orcid || null, inst: inst ? { id: inst.id, display_name: inst.display_name, country_code: inst.country_code } : null },
    works: state.works.map((w) => ({ id: w.id, display_name: w.display_name, publication_year: w.publication_year, cited_by_count: w.cited_by_count, doi: w.doi, jt: w.jt, sty: w.sty, is: w.is, tn: w.tn })),
    ind: state.ind, trunc: state.trunc, fullCount: state.citing.length,
    citing: state.citing.slice(0, 500).map((c) => ({ id: c.id, display_name: c.display_name, publication_date: c.publication_date, doi: c.doi, venue: c.venue, srcId: c.srcId, srcType: c.srcType, fi: c.fi, authors: c.authors, nAuthors: c.nAuthors, isSelf: c.isSelf, my: c.myWorks.map((w) => w.id) }))
  });                                     // dacă memoria browserului e plină, store.set doar eșuează discret
}
const normName = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function snapshotValid(sn) {
  return !!(sn && sn.author && typeof sn.author.id === 'string' && typeof sn.author.display_name === 'string' && Array.isArray(sn.works) && Array.isArray(sn.citing));
}
function findSnapshot() {
  const snap = store.get(SNAP_KEY);
  if (!snapshotValid(snap)) return null;
  if (state.pendingId && snap.author.id === state.pendingId) return snap;     // profilul ales din listă
  const text = $('q').value.trim(), orc = parseOrcid(text);
  if (orc) return snap.author.orcid && parseOrcid(snap.author.orcid) === orc ? snap : null;
  return text && normName(text) === normName(snap.author.display_name) ? snap : null;   // nu arătăm profilul altcuiva
}
function applySnapshot(snap, reason) {
  const works = snap.works.map((w) => ({ ...w })), byId = new Map(works.map((w) => [w.id, w]));
  state.citing = snap.citing.map((c) => {
    const r = { ...c, isNew: false, myWorks: (c.my || []).map((id) => byId.get(id)).filter(Boolean) };
    delete r.my; r._hay = ((r.display_name || '') + ' ' + (r.authors || []).join(' ')).toLowerCase();
    return r;
  });
  state.loading = null; state.limit = false; state.errKind = null; state.rank = null;
  state.author = { id: snap.author.id, display_name: snap.author.display_name, orcid: snap.author.orcid, last_known_institutions: snap.author.inst ? [snap.author.inst] : [] };
  // nota „Arăt cele mai recente N din M" trebuie să descrie ce vedem de fapt (copia ține cel mult 500 de citări)
  const total = snap.trunc ? snap.trunc.total : (snap.fullCount || state.citing.length), shown = state.citing.length;
  state.works = works; state.ind = snap.ind; state.visit = null;
  state.trunc = shown < total ? { shown, total, exact: snap.trunc ? snap.trunc.exact : true } : null;
  state.snapshot = { savedAt: snap.savedAt, reason };
  indexByWork();
  state.page = 1; state.tab = 'feed'; state.filter = ''; state.onlyNew = false;
  $('candidates').innerHTML = ''; setStatus(null);
  render();
}
function snapBannerHtml() {

  if (!S) return '';

/* ---------- Clasament între colegi (doar poziția ta, fără nume) ---------- */
const RANK_BINS = { cites: [9, 49, 199, 999, 4999], h: [2, 5, 9, 19, 39] };
const RANK_PCTS = [50, 25, 10, 5, 1];
const RANK_TTL = 7 * 24 * 60 * 60 * 1000;   // distribuția unei universități se schimbă încet: o păstrăm o săptămână
const RANK_MIN = 30;                         // sub acest număr de colegi comparația nu are sens
let rankToken = 0;

function rankInit() { return { metric: 'cites', scope: 'inst', active: true, instIdx: 0, author: null, data: null, status: 'idle', err: null }; }
const rankField = (m) => (m === 'h' ? 'summary_stats.h_index' : 'cited_by_count');
const rankMine = (au, m) => (m === 'h' ? (au.summary_stats && au.summary_stats.h_index) : au.cited_by_count);

function rankScope(R) {
  const insts = ((R.author && R.author.last_known_institutions) || []).filter((i) => i && i.id);
  if (!insts.length) return null;
  const inst = insts[Math.min(R.instIdx, insts.length - 1)];
  if (R.scope === 'country' && inst.country_code) return { kind: 'country', code: inst.country_code, inst, insts };
  return { kind: 'inst', id: shortId(inst.id), inst, insts };
}
function rankBase(scope, active) {
  const p = [scope.kind === 'inst' ? 'last_known_institutions.id:' + scope.id : 'last_known_institutions.country_code:' + scope.code];
  if (active) p.push('works_count:>4');             // „cercetători activi": cel puțin 5 lucrări
  return p;
}
async function rankCount(parts) {
  const r = await apiRetry('/authors', { filter: parts.join(','), 'per-page': 1, select: 'id' });   // cerem doar totalul, nu lista
  if (!r || !r.meta || typeof r.meta.count !== 'number') throw new Error('no count');
  return r.meta.count;
}
async function rankCompute(R, scope) {
  const fld = rankField(R.metric), base = rankBase(scope, R.active);
  const key = ['rk1', scope.kind === 'inst' ? scope.id : scope.code, R.metric, R.active ? 'a' : 'all'].join(':');
  let dist = store.get(key);
  if (!dist || !dist.at || Date.now() - dist.at > RANK_TTL) {
    const total = await rankCount(base);
    dist = { at: Date.now(), total, gt: [], thr: {} };
    if (total >= RANK_MIN) {
      dist.gt = await Promise.all(RANK_BINS[R.metric].map((T) => rankCount([...base, fld + ':>' + T])));
      const got = await Promise.all(RANK_PCTS.map(async (pct) => {
        const k = Math.max(1, Math.ceil(total * pct / 100));
        if (k > 10000) return [pct, null];           // limita de paginare simplă a OpenAlex
        const r = await apiRetry('/authors', { filter: base.join(','), sort: fld + ':desc', 'per-page': 1, page: k, select: R.metric === 'h' ? 'summary_stats' : 'cited_by_count' });
        const a = r.results && r.results[0];
        return [pct, a ? (R.metric === 'h' ? (a.summary_stats && a.summary_stats.h_index) : a.cited_by_count) : null];
      }));
      got.forEach(([pct, v]) => { if (typeof v === 'number') dist.thr[pct] = v; });
    }
    store.set(key, dist);
  }
  const mine = rankMine(R.author, R.metric);
  if (typeof mine !== 'number') throw new Error('no value');
  const above = dist.total >= RANK_MIN ? await rankCount([...base, fld + ':>' + mine]) : 0;
  return { ...dist, mine, above, scope };
}

async function loadRank() {
  if (state.snapshot) return;
  const R = state.rank, token = ++rankToken;
  R.status = 'loading'; renderRank();
  try {
    if (!R.author) R.author = await api('/authors/' + shortId(state.author.id), { select: 'id,cited_by_count,works_count,summary_stats,last_known_institutions,counts_by_year' });
    if (token !== rankToken) return;
    const scope = rankScope(R);
    if (!scope) { R.status = 'noinst'; renderRank(); return; }
    R.data = await rankCompute(R, scope);
    if (token !== rankToken) return;
    R.status = R.data.total < RANK_MIN ? 'few' : 'ok';
  } catch (e) { if (token !== rankToken) return; R.status = 'error'; R.err = e; }
  renderRank();
}

function rankBinLabels(metric) {
  const T = RANK_BINS[metric], n = (v) => v.toLocaleString(lang);
  return [`0–${n(T[0])}`, ...T.slice(1).map((t, i) => `${n(T[i] + 1)}–${n(t)}`), `${n(T[T.length - 1] + 1)}+`];
}
function recentPace(au) {            // citările primite pe an, media ultimilor 3 ani încheiați (OpenAlex ține ~10 ani)
  const y = new Date().getFullYear(), rows = ((au && au.counts_by_year) || []).filter((r) => r.year >= y - 3 && r.year <= y - 1);
  if (!rows.length) return 0;
  return Math.round(rows.reduce((n, r) => n + (r.cited_by_count || 0), 0) / rows.length);
}
function rankHtml() {
  const R = state.rank, n = (v) => v.toLocaleString(lang);
  const seg = (attr, val, cur, label) => `<button type="button" class="seg${val === cur ? ' on' : ''}" data-${attr}="${val}" aria-pressed="${val === cur}">${esc(label)}</button>`;
  const scope = R.author ? rankScope(R) : null;
  let controls = `<div class="rk-controls">
    <span class="seggrp">${seg('rkm', 'cites', R.metric, t('rk_m_cites'))}${seg('rkm', 'h', R.metric, t('rk_m_h'))}</span>
    ${scope && scope.inst.country_code ? `<span class="seggrp">${seg('rks', 'inst', R.scope, t('rk_s_inst'))}${seg('rks', 'country', R.scope, t('rk_s_country'))}</span>` : ''}
    ${scope && scope.insts.length > 1 ? `<select id="rk-inst" aria-label="${esc(t('rk_inst_label'))}">${scope.insts.map((i, k) => `<option value="${k}"${k === R.instIdx ? ' selected' : ''}>${esc(i.display_name)}</option>`).join('')}</select>` : ''}
    <label class="rk-act"><input type="checkbox" id="rk-active" ${R.active ? 'checked' : ''}> ${esc(t('rk_active'))}</label>
  </div>`;
  let body = '';
  const line = (w, h, st = '') => `<div class="skel" style="width:${w};height:${h}px;${st}"></div>`;
  if (R.status === 'loading' || R.status === 'idle') body = `<div class="rk-skel">${line('45%', 40)}${line('70%', 14, 'margin-top:10px')}${line('100%', 120, 'margin-top:22px')}</div>`;
  else if (R.status === 'noinst') body = `<p class="empty">${esc(t('rk_noinst'))}</p>`;
  else if (R.status === 'few') body = `<p class="empty">${esc(t('rk_few', { n: R.data.total }))}</p>`;
  else if (R.status === 'error') {
    const lim = R.err && R.err.apiCode === 429;
    body = `<p class="empty">${esc(t(lim ? 'rk_limit' : 'rk_err'))}</p><button type="button" class="ghost" id="rk-retry">${esc(t('oops_retry'))}</button>`;
  } else {
    const d = R.data, rank = d.above + 1, top = Math.max(1, Math.ceil(rank / d.total * 100)), T = RANK_BINS[R.metric];
    const gt = d.gt, counts = [d.total - gt[0], ...gt.slice(0, -1).map((g, i) => g - gt[i + 1]), gt[gt.length - 1]];
    const mineBin = T.filter((x) => d.mine > x).length, maxC = Math.max(...counts, 1), labs = rankBinLabels(R.metric);
    const sc = d.scope, place = sc.kind === 'inst' ? sc.inst.display_name : regionName(sc.code);
    const who = t(sc.kind === 'inst' ? 'rk_among_inst' : 'rk_among_country', { name: place });
    const bars = counts.map((c, i) => {
      const pct = c / d.total * 100, h = Math.max(3, Math.round(c / maxC * 96));
      return `<div class="rk-col${i === mineBin ? ' me' : ''}" data-count="${c}"><span class="rk-pct">${pct < 1 && c > 0 ? '<1' : Math.round(pct)}%</span><div class="rk-bar" style="height:${h}px"></div><span class="rk-lab">${esc(labs[i])}</span>${i === mineBin ? `<span class="rk-you">${esc(t('rk_you'))}</span>` : ''}</div>`;
    }).join('');
    const pace = R.metric === 'cites' ? recentPace(R.author) : 0;
    const next = RANK_PCTS.filter((p) => typeof d.thr[p] === 'number' && d.thr[p] > d.mine).slice(0, 2);
    const nextHtml = next.length ? `<div class="rk-next"><p class="rk-h">${esc(t('rk_next'))}</p><ul>${next.map((p) => {
      const need = d.thr[p] - d.mine, yrs = pace > 0 ? Math.max(1, Math.ceil(need / pace)) : 0;
      const fmt = (x) => (R.metric === 'h' ? n(x) : cnt('citation', x));
      return `<li>${esc(t(R.metric === 'h' ? 'rk_step_h' : 'rk_step', { p, v: fmt(d.thr[p]), need: fmt(need) }))}${yrs ? ` <span class="rk-muted">${esc(t('rk_years', { y: cnt('year', yrs) }))}</span>` : ''}</li>`;
    }).join('')}</ul>${pace > 0 ? `<p class="rk-small">${esc(t('rk_pace', { r: n(pace) }))}</p>` : ''}</div>` : (top <= 1 ? `<div class="rk-next"><p class="rk-h">${esc(t('rk_top1'))}</p></div>` : '');
    body = `<div class="rk-score"><span class="rk-top">${esc(t('rk_top', { p: top }))}</span><span class="rk-sub">${esc(t('rk_place', { rank: n(rank), total: n(d.total) }))}</span></div>
      <p class="rk-who">${esc(who)}${infoBtn(t('rk_title'), t('rk_note'))}</p>
      <div class="rk-hist" role="img" aria-label="${esc(t('rk_hist_aria', { you: labs[mineBin] }))}">${bars}</div>
      ${nextHtml}`;
  }
  return `${controls}${body}`;
}
function regionName(code) { try { return new Intl.DisplayNames([lang], { type: 'region' }).of(code) || code; } catch (e) { return code; } }

function renderRank() {
  const box = $('rank-box');
  if (!box || !state.rank) return;
  box.innerHTML = rankHtml();
  const R = state.rank, again = () => { R.status = 'idle'; loadRank(); };
  box.querySelectorAll('[data-rkm]').forEach((b) => b.onclick = () => { R.metric = b.dataset.rkm; again(); });
  box.querySelectorAll('[data-rks]').forEach((b) => b.onclick = () => { R.scope = b.dataset.rks; again(); });
  const act = $('rk-active'); if (act) act.onchange = (e) => { R.active = e.target.checked; again(); };
  const sel = $('rk-inst'); if (sel) sel.onchange = (e) => { R.instIdx = +e.target.value; again(); };
  const rt = $('rk-retry'); if (rt) rt.onclick = again;
}

/* ---------- Feedback (fereastră în colț, trimis prin Web3Forms) ---------- */
const FB_ENDPOINT = 'https://api.web3forms.com/submit';
const FB_WAIT_MS = 60 * 1000;
let fbTopic = '', fbReturnFocus = null;

function fbRefresh() {
  const tp = $('fbtopic');
  tp.hidden = fbTopic !== 'full' && fbTopic !== 'error';
  tp.textContent = fbTopic === 'full' ? t('fb_topic_full') : fbTopic === 'error' ? t('fb_topic_error', { code: state.errInfo ? ' (' + state.errInfo + ')' : '' }) : '';
  const has = !!state.author;
  $('fbprofwrap').hidden = !has;
  if (has) $('fbproftxt').textContent = t('fb_profile', { name: state.author.display_name });
}
function openFeedback(topic) {
  if (!FEEDBACK_KEY) return;
  fbTopic = topic || 'general';
  fbReturnFocus = document.activeElement;
  fbRefresh();
  $('fbform').hidden = false; $('fbdone').hidden = true;
  $('fbstatus').textContent = '';
  $('fbpanel').hidden = false; $('fbbtn').hidden = true;
  $('fbmsg').focus();
}
function closeFeedback() {
  $('fbpanel').hidden = true;
  if (FEEDBACK_KEY) $('fbbtn').hidden = false;
  if (fbReturnFocus && fbReturnFocus.focus) fbReturnFocus.focus();
}
function fbDone() {
  $('fbform').hidden = true; $('fbdone').hidden = false;
  $('fbclose2').focus();
}
async function sendFeedback() {
  const st = $('fbstatus');
  const msg = $('fbmsg').value.trim(), email = $('fbemail').value.trim();
  const fail = (key) => { st.className = 'fb-status'; st.textContent = t(key); };
  if (msg.length < 5) return fail('fb_err_short');
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('fb_err_email');
  const last = store.get('fb_last');
  if (last && Date.now() - last < FB_WAIT_MS) return fail('fb_err_wait');
  if ($('fbhp').value) { $('fbmsg').value = ''; return fbDone(); }   // capcană pentru roboți: nu trimitem nimic

  const payload = {
    access_key: FEEDBACK_KEY,
    subject: 'Cine m-a citat · feedback' + (fbTopic === 'full' ? ' · lista completă' : '') + (fbTopic === 'error' ? ' · eroare' : ''),
    from_name: 'Cine m-a citat',
    message: msg,
    botcheck: '',
    language: lang,
    edition: FULL_LOAD ? 'full' : 'young researcher',
    screen: window.innerWidth + 'x' + window.innerHeight,
    browser: navigator.userAgent
  };
  if (fbTopic === 'error' && state.errInfo) payload.error = state.errInfo;
  if (email) payload.email = email;
  if ($('fbprof').checked && state.author) { payload.profile = state.author.display_name; payload.openalex_id = state.author.id; }

  $('fbsend').disabled = true;
  st.className = 'fb-status info'; st.textContent = t('fb_sending');
  try {
    const r = await fetch(FB_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!(r.ok && j.success)) throw new Error('rejected');
    store.set('fb_last', Date.now());
    $('fbmsg').value = ''; $('fbemail').value = ''; $('fbprof').checked = false; st.textContent = '';
    fbDone();
  } catch (e) {
    st.className = 'fb-status';
    if (FEEDBACK_EMAIL) {
      const href = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + encodeURIComponent(payload.subject) + '&body=' + encodeURIComponent(msg);
      st.innerHTML = esc(t('fb_err_send_mail', { link: '\u0000' })).replace('\u0000', `<a href="${esc(href)}">${esc(t('fb_mail_link'))}</a>`);
    } else st.textContent = t('fb_err_send');
  } finally { $('fbsend').disabled = false; }
}
$('fbbtn').onclick = () => openFeedback('general');
$('fbclose').onclick = closeFeedback;
$('fbclose2').onclick = closeFeedback;
$('fbsend').onclick = sendFeedback;
$('fbmsg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendFeedback(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('fbpanel').hidden) closeFeedback(); });
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[data-fb]');
  if (a && FEEDBACK_KEY) { e.preventDefault(); openFeedback(a.dataset.fb); }
});

function onUnexpected(e) {
  const err = e && (e.reason || e.error);
  if (state.loading) showErrorState('unexpected', err && err.apiCode ? err : { message: String((err && err.message) || err || '') });
}
window.addEventListener('unhandledrejection', onUnexpected);
window.addEventListener('error', onUnexpected);

document.querySelectorAll('.langs button').forEach((b) => b.onclick = () => setLang(b.dataset.lang));
function setTip(open) {
  $('emailtip').classList.toggle('open', open);
  $('tipbtn').setAttribute('aria-expanded', String(open));
}
$('tipbtn').addEventListener('click', (e) => { e.stopPropagation(); setTip(!$('emailtip').classList.contains('open')); });

$('go').onclick = start;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
const savedPal = store.get('palette');
if (savedPal && PALETTES.some((p) => p.id === savedPal)) document.documentElement.dataset.pal = savedPal;
$('pals').addEventListener('click', (e) => {

  // 1. link partajabil: ...?orcid=0000-0002-1825-0097
  const fromUrl = parseOrcid(new URLSearchParams(location.search).get('orcid') || '');
  if (fromUrl) { $('q').value = fromUrl; start(); return; }

    $('go').disabled = false;
  }
})();
